name: MyARC Fitness
description: >-
  MyARC (operated by Vert Analytics Limited) is an all-in-one platform that lets
  fitness creators and coaches scale their business without writing code. Coaches
  use MyARC to launch a branded mobile app, automate AI-personalized workout and
  meal plans for thousands of members at once, run challenges and 1-on-1 coaching,
  build community, and earn recurring subscription revenue. The consumer-facing
  MyARC Fitness app ships on iOS and Android with progress tracking and
  accountability features. As of this profile MyARC exposes no public developer
  API, SDKs, or documentation surface — it is a creator-facing SaaS and mobile
  product, not an API provider. Offices in London, New York, Melbourne, and India.
